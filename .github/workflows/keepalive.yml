name: Keepalive

# 每 6 天自动 ping 一次 Supabase，避免免费项目因 7 天无流量被自动暂停
on:
  schedule:
    - cron: '17 3 */6 * *'
  workflow_dispatch: # 允许手动触发测试

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 请求 Supabase 接口保活
        run: |
          curl -s -o /dev/null -w "Supabase HTTP %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/categories?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
